server:
  port: 8080

spring:
  application:
    name: zuzuxia-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，便于前端联调时核对字段；上线前应改为 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
  mapper-locations: classpath*:mapper/**/*.xml

# JWT 配置。生产环境务必通过环境变量覆盖 jwt.secret
jwt:
  secret: ${JWT_SECRET:zuzuxia-secret-key-for-course-project-please-change-in-production-2026}
  expire-hours: 24

# 上传图片存放目录，对外暴露为 /uploads/**
upload:
  path: ./uploads/
  url-prefix: /uploads/

# Knife4j 接口文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn
